services:
  postgres:
    image: postgres:17
    container_name: forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_dev_password
    ports:
      - "5432:5432"
    volumes:
      - forge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  forge-postgres-data: